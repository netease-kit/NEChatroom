name: Android Build

on:
  push:
    branches:
      - master
      - "build/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission
        working-directory: Android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: Android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -n "$(find Android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh Android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEChatroom-debug
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
