name: imchat_rebuild
description: Independent Flutter reimplementation scaffold for Im Chat.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/original/icons/
    - assets/original/images/
    - assets/original/fonts/
    - assets/original/lottie/
    - assets/original/sounds/
    - assets/original/videos/
